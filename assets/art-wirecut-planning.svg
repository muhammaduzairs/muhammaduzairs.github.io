 <g font-family="Arial,Helvetica,sans-serif" fill="#eef5fb"><text x="40" y="58" font-size="36" fill="#eef5fb" font-weight="600" text-anchor="start" >Wire-cut guideline planning</text><text x="40" y="101" font-size="25" fill="#f0b35b" font-weight="500" text-anchor="start" >Scrap piece-size requirement: 400 × 400 mm</text><rect x="40" y="137" width="650" height="351" rx="12" fill="#142e43" stroke="#34546b" stroke-width="1.5"/><text x="65" y="177" font-size="22" fill="#f0b35b" font-weight="600" text-anchor="start" >GEOMETRY + OPERATING INPUTS</text><circle cx="136" cy="288" r="68" fill="#0f273a" stroke="#86c7d5" stroke-width="2.5"/><circle cx="136" cy="288" r="59" fill="none" stroke="#86c7d5" stroke-width="1.4" opacity=".5"/><path d="M70 288H202" fill="none" stroke="#86c7d5" stroke-width="1.9" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="136" y="331" font-size="25" fill="#eef5fb" font-weight="600" text-anchor="middle" >D</text><text x="136" y="402" font-size="22" fill="#a3b9ca" font-weight="400" text-anchor="middle" >Pipe diameter</text><rect x="245" y="199" width="413" height="114" rx="9" fill="#19394e" stroke="#345970" stroke-width="1.5"/><text x="268" y="233" font-size="23" fill="#eef5fb" font-weight="600" text-anchor="start" >Geometry basis</text><text x="268" y="267" font-size="24" fill="#86c7d5" font-weight="500" text-anchor="start" >Pipe OD · C = πD</text><text x="268" y="297" font-size="22" fill="#a3b9ca" font-weight="400" text-anchor="start" >400 × 400 mm requirement</text><rect x="245" y="333" width="413" height="120" rx="9" fill="#19394e" stroke="#345970" stroke-width="1.5"/><text x="268" y="367" font-size="23" fill="#eef5fb" font-weight="600" text-anchor="start" >Operating inputs</text><text x="268" y="401" font-size="23" fill="#86c7d5" font-weight="500" text-anchor="start" >Feed rate · machine RPM</text><text x="268" y="435" font-size="22" fill="#a3b9ca" font-weight="400" text-anchor="start" >Wire speed, where applicable</text><path d="M699 326H731" fill="none" stroke="#86c7d5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="747" y="137" width="413" height="351" rx="12" fill="#142e43" stroke="#34546b" stroke-width="1.5"/><text x="772" y="177" font-size="22" fill="#f0b35b" font-weight="600" text-anchor="start" >CUT-PIECE CHECK</text><rect x="820" y="225" width="215" height="215" fill="#0d2238" stroke="#86c7d5" stroke-width="2" stroke-dasharray="7 7"/><path d="M848 354Q876 251 1008 253L1008 295Q905 291 889 385Z" fill="#86c7d52b" stroke="#86c7d5" stroke-width="2.5"/><path d="M820 209H1035" fill="none" stroke="#86c7d5" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="927.5" y="201" font-size="22" fill="#eef5fb" font-weight="500" text-anchor="middle" >400 mm</text><path d="M1060 225V440" fill="none" stroke="#86c7d5" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1090" y="337" font-size="22" fill="#eef5fb" font-weight="500" text-anchor="middle" transform="rotate(90 1090 337)">400 mm</text><text x="953" y="474" font-size="22" fill="#a3b9ca" font-weight="400" text-anchor="middle" >Check both dimensions</text><rect x="40" y="524" width="1120" height="128" rx="12" fill="#173549" stroke="#416178" stroke-width="1.5"/><text x="65" y="562" font-size="23" fill="#f0b35b" font-weight="600" text-anchor="start" >WORKED PERIMETER REFERENCE · 44 in PIPE</text><text x="65" y="602" font-size="25" fill="#eef5fb" font-weight="500" text-anchor="start" >D = 1117.6 mm  →  C ≈ 3511.04 mm  →  ceil(C / 400) = 9</text><text x="65" y="635" font-size="23" fill="#86c7d5" font-weight="400" text-anchor="start" >Arc-planning length: C / 9 ≈ 390.12 mm</text><text x="600" y="695" font-size="22" fill="#a3b9ca" font-weight="400" text-anchor="middle" >Arc planning informs the layout; final cuts and re-cuts depend on geometry and setup.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">BOM, material usage and OEE review</title><desc id="desc">Illustrative review method: compare BOM with production records, investigate a mismatch, review material usage variance against a plus or minus ten percent band, and examine OEE as availability times performance times quality.</desc>

<g font-family="sans-serif" fill="#eef5fb">
<text x="44" y="66" font-size="38" font-weight="700">Production records &amp; engineering review</text>
<text x="44" y="106" font-size="23" fill="#a9c2d3">BOM accuracy · material usage variance · equipment effectiveness</text>
<rect x="44" y="140" width="548" height="357" rx="16" fill="#173449" stroke="#365a72"/>
<text x="72" y="185" font-size="28" font-weight="700">01 · Compare records</text>
<text x="169" y="231" text-anchor="middle" font-size="23" fill="#a9c2d3">BOM</text><text x="443" y="231" text-anchor="middle" font-size="23" fill="#a9c2d3">Production records</text>
<g fill="#0d2238" stroke="#3d6179"><rect x="74" y="251" width="191" height="43" rx="5"/><rect x="348" y="251" width="191" height="43" rx="5"/><rect x="74" y="314" width="191" height="43" rx="5"/><rect x="348" y="314" width="191" height="43" rx="5"/><rect x="74" y="377" width="191" height="43" rx="5"/><rect x="348" y="377" width="191" height="43" rx="5"/></g>

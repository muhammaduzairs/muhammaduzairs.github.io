<g text-anchor="middle" font-size="33" fill="#a9c2d3"><text x="307" y="284">=</text><text x="307" y="348" fill="#f0b35b">≠</text><text x="307" y="411">=</text></g>
<text x="72" y="466" font-size="23" fill="#f0b35b">Investigate component discrepancies</text>
<rect x="614" y="140" width="542" height="357" rx="16" fill="#173449" stroke="#365a72"/>
<text x="642" y="185" font-size="28" font-weight="700">02 · Review MUV</text>
<text x="642" y="226" font-size="23" fill="#a9c2d3">Material usage variance tolerance</text>
<rect x="748" y="263" width="265" height="106" fill="#f0b35b" fill-opacity=".13" stroke="#f0b35b" stroke-width="1.8" stroke-dasharray="7 6"/>
<path d="M667 319H1100" stroke="#86c7d5" stroke-width="2.5"/>
<g stroke="#7094aa" stroke-width="1.7"><path d="M748 309V329M880.5 309V329M1013 309V329"/></g>
<g fill="#86c7d5"><circle cx="791" cy="319" r="10"/><circle cx="880" cy="319" r="10"/><circle cx="957" cy="319" r="10"/></g><circle cx="1074" cy="319" r="10" fill="#f0b35b"/>
<g font-size="23" text-anchor="middle" fill="#a9c2d3"><text x="748" y="405">−10%</text><text x="880.5" y="405">0</text><text x="1013" y="405">+10%</text></g>
<text x="642" y="466" font-size="23" fill="#f0b35b">Illustrative positions · no actual values</text>
<rect x="44" y="522" width="1112" height="128" rx="16" fill="#173449" stroke="#365a72"/>
<text x="72" y="565" font-size="28" font-weight="700">03 · Review OEE</text>
<text x="72" y="612" font-size="27" fill="#a9c2d3">OEE = <tspan fill="#eef5fb">Availability × Performance × Quality</tspan></text>
<text x="600" y="690" text-anchor="middle" font-size="22" fill="#9bb8cb">Illustrative review framework · supports documentation and production performance assessment.</text>
